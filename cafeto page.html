<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cafeto Gourmet — Protótipo IHC (Vanilla JS)</title>
  <style>
    /* Reset & base */
    :root{--accent:#7b3f00;--muted:#666;--bg:#faf7f3}
    *{box-sizing:border-box}
    body{font-family:Inter, system-ui, -apple-system, Roboto, "Helvetica Neue", Arial; margin:0;background:var(--bg);color:#222}
    header{background:white;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#8b5a2b,#c0894b);display:flex;align-items:center;justify-content:center;color:white;font-weight:700}
    .search{flex:1;margin:0 16px}
    input[type=search]{width:100%;padding:10px;border-radius:8px;border:1px solid #e3e0dd}
    main{display:grid;grid-template-columns:1fr 340px;gap:20px;padding:20px;max-width:1200px;margin:18px auto}
    /* product grid */
    .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
    .card{background:white;padding:12px;border-radius:12px;box-shadow:0 6px 18px rgba(16,24,40,0.04);display:flex;flex-direction:column;gap:8px}
    .img{height:140px;border-radius:8px;background:#efe7df;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted)}
    .meta{display:flex;justify-content:space-between;align-items:center}
    button{background:var(--accent);color:white;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
    button.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
    .cart{position:sticky;top:20px;background:white;padding:16px;border-radius:12px;height:max-content;box-shadow:0 6px 18px rgba(16,24,40,0.06)}
    .cart h3{margin:0 0 8px 0}
    .cart-items{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto;padding-right:8px}
    .cart-item{display:flex;gap:8px;align-items:center}
    .qty{display:flex;gap:6px;align-items:center}
    footer{padding:16px;text-align:center;color:var(--muted)}
    @media (max-width:900px){main{grid-template-columns:1fr} .cart{position:static}}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">CG</div>
      <div>
        <div style="font-weight:700">Cafeto Gourmet</div>
        <div style="font-size:12px;color:var(--muted)"O melhor para quem você ama!"</div>
      </div>
    </div>

    <div class="search" aria-hidden>
      <input id="searchInput" type="search" placeholder="Buscar kits, blends ou acompanhamentos..." aria-label="Buscar produtos" />
    </div>

    <div style="display:flex;gap:12px;align-items:center">
      <button id="viewFavorites" class="secondary" title="Favoritos">❤ Favoritos</button>
      <button id="clearStorage" class="secondary" title="Limpar dados">🗑️ Limpar</button>
    </div>
  </header>

  <main>
    <section>
      <h2 style="margin:8px 0 12px">Vitrine — Kits e produtos</h2>
      <div id="products" class="products" aria-live="polite"></div>
    </section>

    <aside class="cart" aria-label="Carrinho de compras">
      <h3>Carrinho <small id="cartCount">(0)</small></h3>
      <div class="cart-items" id="cartItems"></div>
      <hr style="border:none;border-top:1px solid #eee;margin:12px 0">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:12px;color:var(--muted)">Total</div>
          <div id="cartTotal" style="font-weight:700">R$ 0,00</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button id="checkoutBtn">Finalizar pedido</button>
          <button id="emptyCart" class="secondary">Esvaziar</button>
        </div>
      </div>
    </aside>
  </main>

  <footer>
    Protótipo criado para disciplina de IHC — Eder Rodrigues (RGM 33207437)
  </footer>

  <script>
    /************************************************************************
     * Protótipo de IHC para "Cafeto Gourmet" (Vanilla JS)
     * - Produtos fictícios (extraídos do backlog do documento enviado)
     * - Acessibilidade simples (aria-labels, aria-live)
     * - Persistência via localStorage (favoritos e carrinho)
     * - Recurso de busca, adicionar ao carrinho, remover, checkout simulado
     ************************************************************************/

    // Dados iniciais (pode ser extraído e ampliado do documento PIC_Cafeto_Gourmet.docx)
    const PRODUCTS = [
      { id: 'kit1', title: 'Kit Café da Manhã Especial', price: 89.9, desc: '2 blends artesanais + 1 geleia + embalagem presente', tag: 'kit' },
      { id: 'kit2', title: 'Blend Arábica Premium 250g', price: 29.5, desc: 'Torra média, notas de chocolate', tag: 'blend' },
      { id: 'kit3', title: 'Café Moído para Prensa 500g', price: 49.0, desc: 'Sabor encorpado para prensa francesa', tag: 'blend' },
      { id: 'kit4', title: 'Acompanhamento: Cookies Caseiros', price: 12.0, desc: '6 unidades', tag: 'acompanhamento' },
      { id: 'kit5', title: 'Kit Presente (Luxo)', price: 129.9, desc: 'Embalagem premium + cartão', tag: 'kit' }
    ];

    // Helpers
    const toBRL = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

    // App state persisted
    const Storage = {
      getCart(){ return JSON.parse(localStorage.getItem('cg_cart')||'[]')},
      setCart(c){ localStorage.setItem('cg_cart', JSON.stringify(c))},
      getFavs(){ return JSON.parse(localStorage.getItem('cg_favs')||'[]')},
      setFavs(f){ localStorage.setItem('cg_favs', JSON.stringify(f))},
      clear(){ localStorage.removeItem('cg_cart'); localStorage.removeItem('cg_favs') }
    }

    // Render products
    const productsEl = document.getElementById('products');
    const cartItemsEl = document.getElementById('cartItems');
    const cartCountEl = document.getElementById('cartCount');
    const cartTotalEl = document.getElementById('cartTotal');
    const searchInput = document.getElementById('searchInput');

    function renderProducts(filter=''){
      productsEl.innerHTML='';
      const favs = Storage.getFavs();
      const list = PRODUCTS.filter(p => (p.title + ' ' + p.desc + ' ' + p.tag).toLowerCase().includes(filter.toLowerCase()));
      list.forEach(p => {
        const card = document.createElement('article'); card.className='card';
        card.innerHTML = `
          <div class="img" aria-hidden>Imagem ${p.tag}</div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="font-weight:700">${p.title}</div>
            <div style="font-size:14px;color:${p.price>100? 'var(--accent)': 'var(--muted)'}">${toBRL(p.price)}</div>
          </div>
          <div style="font-size:13px;color:var(--muted)">${p.desc}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
            <div style="display:flex;gap:8px">
              <button class="addBtn" data-id="${p.id}">Adicionar</button>
              <button class="detailBtn" data-id="${p.id}" class="secondary">Detalhes</button>
            </div>
            <button class="favBtn" aria-pressed="${favs.includes(p.id)}" data-id="${p.id}">❤</button>
          </div>`;
        productsEl.appendChild(card);
      });
      attachProductListeners();
    }

    // Cart logic
    function getCart(){return Storage.getCart()}
    function setCart(cart){ Storage.setCart(cart); renderCart(); }

    function addToCart(productId, qty=1){
      const cart = getCart();
      const idx = cart.findIndex(i=>i.id===productId);
      if(idx>-1) cart[idx].qty += qty; else cart.push({ id: productId, qty });
      Storage.setCart(cart); renderCart();
    }

    function removeFromCart(productId){
      let cart = getCart().filter(i=>i.id!==productId);
      Storage.setCart(cart); renderCart();
    }

    function changeQty(productId, delta){
      const cart = getCart();
      const idx = cart.findIndex(i=>i.id===productId);
      if(idx===-1) return;
      cart[idx].qty += delta;
      if(cart[idx].qty<1) cart.splice(idx,1);
      Storage.setCart(cart); renderCart();
    }

    function renderCart(){
      const cart = getCart();
      cartItemsEl.innerHTML='';
      let total=0; let count=0;
      cart.forEach(item=>{
        const p = PRODUCTS.find(x=>x.id===item.id);
        if(!p) return;
        total += p.price * item.qty; count += item.qty;
        const div = document.createElement('div'); div.className='cart-item';
        div.innerHTML = `
          <div style="flex:1">
            <div style="font-weight:700">${p.title}</div>
            <div style="font-size:12px;color:var(--muted)">${toBRL(p.price)} x ${item.qty}</div>
          </div>
          <div class="qty">
            <button class="decr" data-id="${p.id}">-</button>
            <div style="min-width:20px;text-align:center">${item.qty}</div>
            <button class="incr" data-id="${p.id}">+</button>
            <button class="rem" data-id="${p.id}">✕</button>
          </div>`;
        cartItemsEl.appendChild(div);
      });
      cartCountEl.textContent = `(${count})`;
      cartTotalEl.textContent = toBRL(total);
      attachCartListeners();
    }

    // Favorites
    function toggleFav(id){
      let favs = Storage.getFavs();
      if(favs.includes(id)) favs = favs.filter(x=>x!==id); else favs.push(id);
      Storage.setFavs(favs); renderProducts(searchInput.value);
    }

    function showFavorites(){
      const favs = Storage.getFavs();
      if(!favs.length){ alert('Nenhum favorito salvo.'); return; }
      const list = PRODUCTS.filter(p=>favs.includes(p.id));
      productsEl.innerHTML='';
      list.forEach(p=>{
        const card = document.createElement('article'); card.className='card';
        card.innerHTML = `
          <div class="img">Fav</div>
          <div style="font-weight:700">${p.title}</div>
          <div style="font-size:13px;color:var(--muted)">${p.desc}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
            <div style="display:flex;gap:8px">
              <button class="addBtn" data-id="${p.id}">Adicionar</button>
            </div>
            <button class="favBtn" aria-pressed="true" data-id="${p.id}">❤</button>
          </div>`;
        productsEl.appendChild(card);
      });
      attachProductListeners();
    }

    // Event attachment
    function attachProductListeners(){
      document.querySelectorAll('.addBtn').forEach(b=>b.onclick = e=>{ addToCart(e.currentTarget.dataset.id); });
      document.querySelectorAll('.favBtn').forEach(b=>b.onclick = e=>{ toggleFav(e.currentTarget.dataset.id); });
      document.querySelectorAll('.detailBtn').forEach(b=>b.onclick = e=>{ showDetails(e.currentTarget.dataset.id); });
    }

    function attachCartListeners(){
      document.querySelectorAll('.incr').forEach(b=>b.onclick = e=>{ changeQty(e.currentTarget.dataset.id,1); });
      document.querySelectorAll('.decr').forEach(b=>b.onclick = e=>{ changeQty(e.currentTarget.dataset.id,-1); });
      document.querySelectorAll('.rem').forEach(b=>b.onclick = e=>{ removeFromCart(e.currentTarget.dataset.id); });
    }

    // Details (simple modal simulated with alert for prototype)
    function showDetails(id){
      const p = PRODUCTS.find(x=>x.id===id);
      if(!p) return;
      alert(`${p.title} — ${p.desc}\nPreço: ${toBRL(p.price)}`);
    }

    // Checkout simulation
    function checkout(){
      const cart = getCart(); if(!cart.length){ alert('Carrinho vazio.'); return; }
      // Regras de negócio simples do documento: frete grátis acima de R$100
      const total = cart.reduce((s,i)=>{
        const p = PRODUCTS.find(x=>x.id===i.id); return s + (p ? p.price*i.qty : 0);
      },0);
      const frete = total>100 ? 0 : 12.5; // exemplo
      const final = total + frete;
      const confirmMsg = `Resumo do pedido:\nItens: ${cart.length}\nSubtotal: ${toBRL(total)}\nFrete: ${toBRL(frete)}\n\nTotal a pagar: ${toBRL(final)}\n\nSimular envio do pedido?`;
      if(confirm(confirmMsg)){
        // Simula criar pedido e limpar carrinho
        Storage.setCart([]);
        alert('Pedido criado com sucesso! (simulação)');
        renderCart();
      }
    }

    // Attach header buttons
    document.getElementById('viewFavorites').onclick = showFavorites;
    document.getElementById('clearStorage').onclick = ()=>{ if(confirm('Apagar carrinho e favoritos?')){ Storage.clear(); renderProducts(); renderCart(); }};
    document.getElementById('emptyCart').onclick = ()=>{ if(confirm('Esvaziar o carrinho?')){ Storage.setCart([]); renderCart(); }};
    document.getElementById('checkoutBtn').onclick = checkout;

    // Search
    searchInput.addEventListener('input', e=> renderProducts(e.target.value));

    // Initial render
    renderProducts(); renderCart();

    // Accessibility tip: focus search on load
    searchInput.focus();
  </script>
</body>
</html>
